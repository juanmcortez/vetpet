name: Bug report
description: Report incorrect or broken behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Include steps to reproduce and expected vs actual behavior.

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Clinic (vet.*)
        - Owner
        - Admin
        - API
        - CI / tooling
        - Unknown
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Docker (`make up`), branch, browser, relevant `.env` overrides (no secrets)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste errors or attach screenshots
    validations:
      required: false
