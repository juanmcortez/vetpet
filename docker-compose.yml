name: vetpet

x-php-service: &php-service
    build:
        context: .
        dockerfile: Dockerfile
        args:
            UID: ${UID:-1000}
            GID: ${GID:-1000}
    volumes:
        - .:/var/www/html
    env_file:
        - .env
    depends_on:
        postgres:
            condition: service_healthy
        redis:
            condition: service_healthy
    networks:
        - vetpet
    restart: unless-stopped

services:
    nginx:
        image: nginx:1.27-alpine
        ports:
            - '${VETPET_HTTP_PORT:-8480}:80'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - vetpet
        restart: unless-stopped

    app:
        <<: *php-service

    horizon:
        <<: *php-service
        command: php artisan horizon

    scheduler:
        <<: *php-service
        command: php artisan schedule:work

    node:
        image: node:22-bookworm
        user: ${UID:-1000}:${GID:-1000}
        working_dir: /var/www/html
        command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
        volumes:
            - .:/var/www/html
        ports:
            - '${VITE_PORT:-5173}:5173'
        environment:
            CHOKIDAR_USEPOLLING: 'true'
        networks:
            - vetpet
        restart: unless-stopped

    postgres:
        image: postgres:17-bookworm
        environment:
            POSTGRES_DB: ${DB_DATABASE:-vetpet}
            POSTGRES_USER: ${DB_USERNAME:-vetpet}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-vetpet}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/02-create-testing-database.sql:/docker-entrypoint-initdb.d/02-create-testing-database.sql:ro
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DB_USERNAME:-vetpet} -d ${DB_DATABASE:-vetpet}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - vetpet
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: redis-server --save 60 1 --loglevel warning
        ports:
            - '${REDIS_PORT:-6379}:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - vetpet
        restart: unless-stopped

    mailpit:
        image: axllent/mailpit:v1.21
        ports:
            - '${MAILPIT_HTTP_PORT:-8025}:8025'
            - '${MAILPIT_SMTP_PORT:-1025}:1025'
        networks:
            - vetpet
        restart: unless-stopped

    minio:
        profiles:
            - storage
        image: minio/minio:RELEASE.2024-12-18T13-15-44Z
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-vetpet}
            MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-vetpetsecret}
        ports:
            - '${MINIO_API_PORT:-9000}:9000'
            - '${MINIO_CONSOLE_PORT:-9001}:9001'
        volumes:
            - minio_data:/data
        networks:
            - vetpet
        restart: unless-stopped

    minio-init:
        profiles:
            - storage
        image: amazon/aws-cli:2.22.35
        depends_on:
            minio:
                condition: service_started
        environment:
            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-vetpet}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-vetpetsecret}
            AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
        entrypoint: /bin/sh
        command:
            - -c
            - |
                set -eu
                until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do
                  echo "Waiting for MinIO..."
                  sleep 2
                done
                aws --endpoint-url http://minio:9000 s3 mb s3://vetpet 2>/dev/null || true
                echo "MinIO bucket vetpet is ready."
        networks:
            - vetpet

    meilisearch:
        profiles:
            - search
        image: getmeili/meilisearch:v1.12.8
        environment:
            MEILI_ENV: development
            MEILI_NO_ANALYTICS: 'true'
        ports:
            - '${MEILISEARCH_PORT:-7700}:7700'
        volumes:
            - meilisearch_data:/meili_data
        networks:
            - vetpet
        restart: unless-stopped

networks:
    vetpet:
        driver: bridge

volumes:
    postgres_data:
    minio_data:
    meilisearch_data:
